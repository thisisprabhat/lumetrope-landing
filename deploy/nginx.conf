# nginx server block for the static Lumetrope landing site (the contents of dist/).
# Every route is pre-rendered to <route>/index.html, so no SPA fallback is needed.
server {
    listen 80;
    server_name lumetrope.app;
    root /var/www/lumetrope-landing;   # copy dist/ here
    index index.html;

    include /etc/nginx/mime.types;
    # The engine must be application/wasm (mime.types on older nginx lacks it).
    types { application/wasm wasm; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               image/svg+xml application/wasm;   # the 2.6 MB engine compresses to well under 1 MB

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed build output: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Unhashed media: cache for a day.
    location ~ ^/(animations|posters|media|og)/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Pages: always revalidate.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/index.html $uri/ =404;
    }
}
